workflows:
  # iOS Build Workflow
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # App identifiers
        BUNDLE_ID: "com.bdhshakil.veo3" # Unique bundle ID
        APP_NAME: "Veo3 Another"
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      
      - name: Build iOS (unsigned for testing)
        script: |
          flutter build ios --release --no-codesign
      
      # Uncomment for signed build (requires certificates in Codemagic UI)
      # - name: Build signed iOS IPA
      #   script: |
      #     flutter build ipa --release
    
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/*.ipa
    
    publishing:
      email:
        recipients:
          - bdhshakilbd@gmail.com
        notify:
          success: true
          failure: true

  # macOS Build Workflow
  macos-workflow:
    name: macOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      node: 18
      cocoapods: default
      vars:
        APP_NAME: "Veo3 Another"
    
    scripts:
      - name: Enable macOS desktop support
        script: |
          flutter config --enable-macos-desktop
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build macOS app
        script: |
          flutter build macos --release
      
      - name: Bundle Playwright server into app
        script: |
          APP_PATH="build/macos/Build/Products/Release/veo3_another.app"
          PW_DIR="$APP_PATH/Contents/Resources/playwright_server"
          mkdir -p "$PW_DIR"
          
          # Copy the appropriate binary based on architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp playwright_server/playwright_server_macos_arm64 "$PW_DIR/playwright_server_macos_arm64"
            cp playwright_server/playwright_server_macos_x64 "$PW_DIR/playwright_server_macos_x64"
          else
            cp playwright_server/playwright_server_macos_x64 "$PW_DIR/playwright_server_macos_x64"
            cp playwright_server/playwright_server_macos_arm64 "$PW_DIR/playwright_server_macos_arm64" || true
          fi
          
          chmod +x "$PW_DIR"/* || true
          echo "Bundled Playwright server:"
          ls -lah "$PW_DIR"/

      
      - name: Create ZIP archive
        script: |
          cd build/macos/Build/Products/Release
          # Rename if not already renamed (in case create-dmg step failed/skipped)
          if [ -d "veo3_another.app" ]; then
            mv veo3_another.app "$APP_NAME.app"
          fi
          zip -r "$APP_NAME.zip" "$APP_NAME.app"
    
    artifacts:
      - build/macos/Build/Products/Release/*.app
      - build/macos/Build/Products/Release/*.zip
    
    publishing:
      email:
        recipients:
          - bdhshakilbd@gmail.com
        notify:
          success: true
          failure: true

  # Combined iOS + macOS Build (runs both)
  all-platforms:
    name: Build iOS + macOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.yourcompany.veo3another"
        APP_NAME: "Veo3 Another"
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      # iOS Build
      - name: Install iOS CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      
      # macOS Build
      - name: Enable macOS support
        script: |
          flutter config --enable-macos-desktop
      
      - name: Build macOS
        script: |
          flutter build macos --release
      
      - name: Bundle Playwright server into app
        script: |
          APP_PATH="build/macos/Build/Products/Release/veo3_another.app"
          PW_DIR="$APP_PATH/Contents/Resources/playwright_server"
          mkdir -p "$PW_DIR"
          
          # Copy the appropriate binary based on architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp playwright_server/playwright_server_macos_arm64 "$PW_DIR/playwright_server_macos_arm64"
            cp playwright_server/playwright_server_macos_x64 "$PW_DIR/playwright_server_macos_x64"
          else
            cp playwright_server/playwright_server_macos_x64 "$PW_DIR/playwright_server_macos_x64"
            cp playwright_server/playwright_server_macos_arm64 "$PW_DIR/playwright_server_macos_arm64" || true
          fi
          
          chmod +x "$PW_DIR"/* || true
          echo "Bundled Playwright server:"
          ls -lah "$PW_DIR"/
      
      - name: Package macOS
        script: |
          cd build/macos/Build/Products/Release
          mv veo3_another.app "$APP_NAME.app" || true
          zip -r "$APP_NAME-macOS.zip" "$APP_NAME.app"
    
    artifacts:
      - build/ios/iphoneos/*.app
      - build/macos/Build/Products/Release/*.app
      - build/macos/Build/Products/Release/*.zip
    
    publishing:
      email:
        recipients:
          - bdhshakilbd@gmail.com
        notify:
          success: true
          failure: true
